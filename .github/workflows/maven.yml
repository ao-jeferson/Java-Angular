name: Testes
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.1.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '26.9.0'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: ./mvnw -B -ntp spotless:check verify
      - working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Preparar arquivos da aplicação
        run: |
          mkdir release
          cp backend/target/movimento-1.0.0.jar release/Movimento-backend.jar
          cp config-server/target/movimento-config-server-1.0.0.jar release/Movimento-config-server.jar
          tar -czf release/Movimento-frontend.tar.gz -C frontend/dist/movimento/browser .
          cp README.md release/
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: Movimento
          path: release/
