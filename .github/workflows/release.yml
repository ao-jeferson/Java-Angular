name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  tests:
    uses: ./.github/workflows/maven.yml
  publish:
    needs: tests
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Movimento
          path: release/
      - name: Publicar release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh release create "$GITHUB_REF_NAME" release/*
          --title "Movimento $GITHUB_REF_NAME"
          --notes "Movimento: Java 25 (LTS), Spring Boot, Angular, H2, Hibernate e JWT. Inclui API, interface compilada e Config Server opcional. Consulte o README para executar."
